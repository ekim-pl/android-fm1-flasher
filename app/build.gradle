plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def uploadKeystore = System.getenv('ANDROID_KEYSTORE_FILE')
def projectDocsAssets = layout.buildDirectory.dir('generated/projectDocsAssets')

android {
    namespace 'pl.ekim.fm1_flasher'
    compileSdk 36
    useLibrary "android.test.runner"
    useLibrary "android.test.base"
    defaultConfig {
        applicationId 'pl.ekim.fm1_flasher'
        minSdk 34
        targetSdk 36
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
        versionCode 8
        versionName '0.6.0'
    }
    signingConfigs {
        if (uploadKeystore) {
            release {
                storeFile file(uploadKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.recovery'
            versionNameSuffix '-recovery-test'
        }
        release {
            if (uploadKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    bundle { language { enableSplit = false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.returnDefaultValues = true }
    sourceSets.main.assets.srcDir(projectDocsAssets)
}

tasks.register('bundleProjectDocs', Sync) {
    from(rootProject.layout.projectDirectory) {
        include 'about/*.md', 'LICENSE.md', 'PRIVACY_POLICY.md', 'third_party/commonmark-LICENSE.txt', 'third_party/m-flasher-LICENSE.txt', 'third_party/m-flasher-NOTICE.md'
    }
    into(projectDocsAssets.map { it.dir('docs') })
}
tasks.named('preBuild').configure { dependsOn('bundleProjectDocs') }

def releaseTag = System.getenv('FM1_RELEASE_TAG')
if (releaseTag && releaseTag != "v${android.defaultConfig.versionName}") {
    throw new GradleException('Release tag must match v<versionName> from app/build.gradle')
}

dependencies {
    implementation 'org.commonmark:commonmark:0.32.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
