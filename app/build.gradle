import java.time.LocalDate
import java.time.ZoneOffset

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def refreshHours = providers.gradleProperty('fm1RefreshHours').getOrElse('8')
def debugRefreshHours = providers.gradleProperty('fm1DebugRefreshHours').getOrElse('1')
def debugAppUpdateMinutes = providers.gradleProperty('fm1DebugAppUpdateMinutes').getOrElse('15')
if (!debugAppUpdateMinutes.isInteger() || debugAppUpdateMinutes.toInteger() < 1) {
    throw new GradleException('fm1DebugAppUpdateMinutes must be a positive whole number of minutes')
}
[refreshHours, debugRefreshHours].each {
    if (!(it ==~ /[0-9]+/) || it.toInteger() < 1 || it.toInteger() > 168)
        throw new GradleException('Refresh intervals must be whole hours between 1 and 168')
}

def analyticsEnabled = providers.gradleProperty('fm1Analytics').getOrElse('false').toBoolean()
def analyticsEnvironment = providers.gradleProperty('fm1AnalyticsEnvironment').getOrElse('')
def analyticsConfig
if (analyticsEnabled) {
    if (!(analyticsEnvironment in ['test', 'production'])) throw new GradleException('Set -Pfm1AnalyticsEnvironment=test or production')
    def configFile = file("firebase/${analyticsEnvironment}/google-services.json")
    if (!configFile.isFile()) throw new GradleException("Missing Firebase config: ${configFile}")
    analyticsConfig = new groovy.json.JsonSlurper().parse(configFile)
    analyticsConfig = [project: analyticsConfig.project_info, client: analyticsConfig.client.find {
        it.client_info.android_client_info.package_name == 'pl.ekim.fm1_flasher'
    }]
    if (!analyticsConfig.client) throw new GradleException('Firebase Android package does not match applicationId')
}

def uploadKeystore = System.getenv('ANDROID_KEYSTORE_FILE')
def debugKeystore = System.getenv('ANDROID_DEBUG_KEYSTORE_FILE')
def fdroidUpdates = providers.gradleProperty('fm1FdroidUpdates').getOrElse('false').toBoolean()
def googlePlayBuild = providers.gradleProperty('fm1GooglePlayBuild').getOrElse('false').toBoolean()
if (fdroidUpdates && googlePlayBuild) {
    throw new GradleException('Select either the F-Droid or the Google Play distribution')
}
def buildDate = LocalDate.now(ZoneOffset.UTC).toString()
def prVersionName = providers.gradleProperty('fm1PrVersionName').orNull
def nightlyCode = providers.gradleProperty('fm1NightlyCode').orNull?.toInteger()
if (prVersionName != null && (!(prVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+-req-[1-9][0-9]*\.[0-9a-f]{12}/) ||
        nightlyCode != null || analyticsEnabled)) {
    throw new GradleException('Use <stable-version>-req-<number>.<12-character-commit> for a preview without nightly or analytics settings')
}
if (nightlyCode != null && !(nightlyCode in 1000001..2100000000)) {
    throw new GradleException('Nightly versionCode must be between 1000001 and 2100000000')
}
def projectDocsAssets = layout.buildDirectory.dir('generated/projectDocsAssets')

android {
    namespace 'pl.ekim.fm1_flasher'
    compileSdk 36
    buildFeatures { compose true; buildConfig true }
    useLibrary "android.test.runner"
    useLibrary "android.test.base"
    defaultConfig {
        buildConfigField 'int', 'DEFAULT_SOURCE_REFRESH_HOURS', refreshHours
        buildConfigField 'int', 'APP_UPDATE_INTERVAL_MINUTES', '1440'
        buildConfigField 'String', 'APP_BUILD_DATE', '"' + buildDate + '"'
        applicationId 'pl.ekim.fm1_flasher'
        minSdk 34
        targetSdk 36
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
        if (analyticsEnabled) {
            resValue 'string', 'google_app_id', analyticsConfig.client.client_info.mobilesdk_app_id
            resValue 'string', 'google_api_key', analyticsConfig.client.api_key[0].current_key
            resValue 'string', 'project_id', analyticsConfig.project.project_id
            resValue 'string', 'gcm_defaultSenderId', analyticsConfig.project.project_number
        }
        versionCode 43
        versionName '0.11.0'
    }
    signingConfigs {
        if (debugKeystore) {
            debug {
                storeFile file(debugKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
        if (uploadKeystore) {
            release {
                storeFile file(uploadKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'int', 'DEFAULT_SOURCE_REFRESH_HOURS', debugRefreshHours
            buildConfigField 'int', 'APP_UPDATE_INTERVAL_MINUTES', debugAppUpdateMinutes.toInteger().toString()
            if (prVersionName != null) applicationIdSuffix '.preview'
            buildConfigField 'String', 'UPDATE_CHANNEL', prVersionName == null ? '"nightly"' : '""'
            buildConfigField 'String', 'APP_BUILD_KIND', nightlyCode == null ? '"debug"' : '"nightly"'
        }
        release {
            buildConfigField 'String', 'UPDATE_CHANNEL', fdroidUpdates ? '"fdroid"' : '""'
            buildConfigField 'String', 'APP_BUILD_KIND', '"' + (fdroidUpdates ? 'fdroid' : googlePlayBuild ? 'play' : 'release') + '"'
            if (uploadKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    bundle { language { enableSplit = false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.returnDefaultValues = true }
    sourceSets.main.assets.srcDir(projectDocsAssets)
    sourceSets.main.java.srcDir(analyticsEnabled ? 'src/analytics/java' : 'src/noAnalytics/java')
    sourceSets.test.java.srcDir('src/testSupport/java')
    sourceSets.androidTest.java.srcDir('src/testSupport/java')
}

tasks.register('bundleProjectDocs', Sync) {
    from(rootProject.layout.projectDirectory) {
        include 'about/*.md', 'LICENSE.md', 'PRIVACY_POLICY.md', 'third_party/*.txt', 'third_party/*.md'
    }
    into(projectDocsAssets.map { it.dir('docs') })
}
tasks.named('preBuild').configure { dependsOn('bundleProjectDocs') }

def releaseTag = System.getenv('FM1_RELEASE_TAG')
if (releaseTag && releaseTag != "v${android.defaultConfig.versionName}") {
    throw new GradleException('Release tag must match v<versionName> from app/build.gradle')
}

// A production Firebase project must never receive debug-build events.
androidComponents {
    beforeVariants(selector().withBuildType('debug')) { variant ->
        if (analyticsEnabled && analyticsEnvironment == 'production') variant.enable = false
    }
    if (prVersionName != null || nightlyCode != null) {
        onVariants(selector().withBuildType('debug')) { variant ->
            variant.outputs.each { output ->
                if (prVersionName != null) {
                    output.versionName.set(prVersionName)
                } else {
                    output.versionCode.set(nightlyCode)
                    output.versionName.set("${android.defaultConfig.versionName}-nightly.${nightlyCode - 1000000}".toString())
                }
            }
        }
    }
}

dependencies {
    if (analyticsEnabled) {
        implementation platform('com.google.firebase:firebase-bom:34.6.0')
        implementation 'com.google.firebase:firebase-analytics'
    }
    implementation project(':shared')
    implementation project(':composeApp')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'org.commonmark:commonmark:0.32.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
}

// Official firmware is exercised only by an explicit production integration task.
tasks.withType(Test).configureEach {
    if (name != 'firmwareIntegrationTest') exclude '**/FirmwareIntegrationTest.class'
}
// Production Firebase disables debug variants; integration runs separately without analytics.
if (!(analyticsEnabled && analyticsEnvironment == 'production')) {
    tasks.register('firmwareIntegrationTest', Test) {
        description = 'Verify pinned official V15/V16 packages and V15 recovery on simulated flash'
        group = 'verification'
        def unitTests = tasks.named('testDebugUnitTest')
        dependsOn(unitTests)
        testClassesDirs = files(unitTests.map { it.testClassesDirs })
        classpath = files(unitTests.map { it.classpath })
        include '**/FirmwareIntegrationTest.class'
        systemProperty 'fm1.fixtureDir', rootProject.file('build/firmware-fixtures').absolutePath
        systemProperty 'fm1.fixtureManifest', rootProject.file('scripts/firmware-fixtures.json').absolutePath
        inputs.file(rootProject.file('scripts/firmware-fixtures.json'))
        inputs.dir(rootProject.file('build/firmware-fixtures'))
        // A production build must obtain a fresh report, never a cached success.
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
    }
}
